name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
    - source

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build static site
      run: sh build.sh
    - name: Publish to master
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: master
        publish_dir: ./_site
        cname: ariaywang.com
